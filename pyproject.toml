[project]
name = "molten-salt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "TheAdaptoid", email = "the.marion.404@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
]

[project.scripts]
molten-salt = "molten_salt:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
]
